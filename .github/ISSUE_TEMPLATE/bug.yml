name: Bug report
description: Something in the codec, UI, or export path is wrong
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you see, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Image type, Fast vs Deep, budget, and the exact steps.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "0.1.5"
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      options:
        - Portable web (start.bat / npm run serve)
        - GitHub Pages demo
        - Tauri desktop
        - Node tests / benchmark
    validations:
      required: true
