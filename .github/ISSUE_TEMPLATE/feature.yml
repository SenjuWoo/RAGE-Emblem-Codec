name: Feature request
description: A codec, UI, or export improvement
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can you not do today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: Keep Strict Rockstar compatibility in mind. Unverified SVG tricks should stay off by default.
    validations:
      required: true
